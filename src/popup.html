<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab URL Copier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="title-group">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
        <h1>Tab URL Copier</h1>
      </div>
      <p class="subtitle">Select tabs to copy to clipboard</p>
    </header>

    <div id="status" class="status-banner" aria-live="polite"></div>

    <main class="actions-grid">
      <!-- General Window Scopes -->
      <div class="section-label">General</div>
      <button type="button" class="btn" data-scope="all-windows">
        <span class="btn-icon">🌐</span>
        <span class="btn-text">
          <strong>All Windows</strong>
          <small>All tabs across all windows</small>
        </span>
      </button>

      <button type="button" class="btn" data-scope="current-window">
        <span class="btn-icon">🪟</span>
        <span class="btn-text">
          <strong>Current Window</strong>
          <small>All tabs in active window</small>
        </span>
      </button>

      <!-- Left of Active Tab -->
      <div class="section-label">Left of Current Tab</div>
      <div class="btn-row">
        <button type="button" class="btn btn-half" data-scope="left-excl" title="Tabs to the left, excluding active tab">
          <span class="btn-icon">⬅️</span>
          <span class="btn-text">
            <strong>Excl. Active</strong>
            <small>Only tabs to left</small>
          </span>
        </button>

        <button type="button" class="btn btn-half" data-scope="left-incl" title="Tabs to the left, including active tab">
          <span class="btn-icon">⏪</span>
          <span class="btn-text">
            <strong>Incl. Active</strong>
            <small>Tabs to left + current</small>
          </span>
        </button>
      </div>

      <!-- Right of Active Tab -->
      <div class="section-label">Right of Current Tab</div>
      <div class="btn-row">
        <button type="button" class="btn btn-half" data-scope="right-excl" title="Tabs to the right, excluding active tab">
          <span class="btn-icon">➡️</span>
          <span class="btn-text">
            <strong>Excl. Active</strong>
            <small>Only tabs to right</small>
          </span>
        </button>

        <button type="button" class="btn btn-half" data-scope="right-incl" title="Tabs to the right, including active tab">
          <span class="btn-icon">⏩</span>
          <span class="btn-text">
            <strong>Incl. Active</strong>
            <small>Tabs to right + current</small>
          </span>
        </button>
      </div>
    </main>

    <footer class="footer">
      <span>Links are copied one URL per line</span>
    </footer>
  </div>

  <script src="tabUtils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
